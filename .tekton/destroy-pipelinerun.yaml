apiVersion: tekton.dev/v1
kind: PipelineRun
metadata:
  generateName: "cluster-giovedi-destroy-run-"
  namespace: "bs-team-alpha-dev"
  labels:
    tekton.dev/pipeline: "cluster-giovedi-destroy"
    app.kubernetes.io/name: "cluster-giovedi"
    app.kubernetes.io/part-of: "cluster-giovedi"
    owner: so.amin
spec:
  pipelineRef:
    name: "cluster-giovedi-destroy"
  taskRunTemplate:
    serviceAccountName: tekton-pipeline
  params:
    - name: repo-url
      value: "https://github.com/SoykatAmin/cluster-giovedi.git"
    - name: revision
      value: main
    - name: cluster-name
      value: "cluster-giovedi"
    - name: aws-region
      value: "eu-west-1"
    - name: state-bucket
      value: "so-amin-idp-terraform-backend"
    - name: state-lock-table
      value: "so-amin-idp-terraform-backend-lock-table"
  workspaces:
    - name: shared-data
      volumeClaimTemplate:
        metadata:
          labels:
            owner: so.amin
            cluster: "cluster-giovedi"
        spec:
          accessModes:
            - ReadWriteOnce
          resources:
            requests:
              storage: 5Gi
          storageClassName: gp3
